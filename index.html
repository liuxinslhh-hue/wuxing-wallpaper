<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五行配色壁纸生成器 · 东方色彩美学</title>
<style>
body{margin:0;background:#14161a;color:#eee;font-family:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif}
.w{max-width:480px;margin:auto;padding:16px}h1{font-size:22px;margin:6px 0 2px;letter-spacing:4px}.sub{color:#999;font-size:13px;margin-bottom:14px}
.els{display:flex;gap:8px}.els button{flex:1;padding:10px 0;font-size:20px;border-radius:10px;border:1px solid #444;background:#1e2127;color:#ddd;font-family:inherit}
.els button.on{border-color:#e8d3a0;color:#fff;background:#2c2a25}
label{display:block;font-size:13px;color:#aaa;margin:12px 0 4px}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1e2127;color:#eee;font-size:16px;font-family:inherit}
.hint{font-size:12px;color:#c9b68a;margin-top:4px;min-height:16px}
#pv{display:block;margin:14px auto;max-width:100%;max-height:70vh;border-radius:14px;box-shadow:0 8px 30px #0008}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:12px;border-radius:10px;border:0;font-size:15px;font-family:inherit}
#dl{background:#e8d3a0;color:#222}#hd{background:#3a3326;color:#e8d3a0;border:1px solid #e8d3a0}#sh{background:#2a2d33;color:#ddd}
.m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}.m div{background:#1f1d1a;padding:24px;border-radius:14px;max-width:300px;text-align:center;line-height:1.7}
.foot{font-size:11px;color:#666;margin-top:14px;line-height:1.6}
</style></head><body><div class="w">
<h1>五行配色壁纸</h1><div class="sub">取自东方传统色 · 为你的名字配一张壁纸</div>
<div class="els" id="els"></div><div class="hint" id="eldesc"></div>
<label>名字或短句（最多6字）</label><input id="name" maxlength="6" value="阿橙">
<label>生日（可选，仅用于推荐一种配色）</label><input id="bd" type="date"><div class="hint" id="bdh"></div>
<label>尺寸</label><select id="sz"><option value="1170x2532">手机 1170×2532</option><option value="2560x1440">电脑 2560×1440</option></select>
<canvas id="pv"></canvas>
<div class="btns"><button id="dl">下载 PNG</button><button id="hd">无水印高清版</button></div>
<div class="btns" style="margin-top:8px"><button id="sh">复制分享链接</button></div>
<div class="foot">配色灵感来自中国传统色彩与五行意象，仅作审美参考，不涉及任何运势说法。</div>
</div><div class="m" id="modal"><div><b>高清版即将上线</b><br>无水印高清图与多设备套装正在准备中，敬请期待。<br><br><button onclick="modal.style.display='none'" style="padding:8px 20px;border-radius:8px;border:0;background:#e8d3a0">好的</button></div></div>
<script>
const P={
'金':{c:['#f4ecd8','#e2c58f','#b8894a'],ink:'#5a3d1c',seal:'#b23a2a',d:'琥珀 · 缃白 —— 温润的光泽，如秋日晴空',pat:'cloud'},
'木':{c:['#e6efe0','#9fc29a','#3f6b4f'],ink:'#1f3a2a',seal:'#a8362a',d:'松花绿 · 竹青 —— 清润的生长感，如春山新竹',pat:'bamboo'},
'水':{c:['#e9eef2','#7d97b3','#1f2f4a'],ink:'#f2f4f6',seal:'#b03a2e',d:'月白 · 黛蓝 —— 沉静的深邃，如夜海月光',pat:'wave'},
'火':{c:['#f6e3d3','#d1694a','#7a2418'],ink:'#fff3e8',seal:'#f2d7a0',d:'朱砂 · 赭石 —— 明亮的热度，如晚霞烛火',pat:'flame'},
'土':{c:['#f1e6cf','#d2b07a','#8a6a3c'],ink:'#3e2c15',seal:'#a33a26',d:'香色 · 赭黄 —— 厚实的安定，如远山黄土',pat:'mountain'}};
let el='水';const $=i=>document.getElementById(i);
const q=new URLSearchParams(location.search);if(P[q.get('el')])el=q.get('el');if(q.get('name'))$('name').value=q.get('name').slice(0,6);if(q.get('size'))$('sz').value=q.get('size');
Object.keys(P).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{el=k;draw()};$('els').appendChild(b)});
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function draw(){
 [...$('els').children].forEach(b=>b.classList.toggle('on',b.textContent==el));
 const p=P[el];$('eldesc').textContent=p.d;
 const [W,H]=$('sz').value.split('x').map(Number),cv=$('pv'),x=cv.getContext('2d');cv.width=W;cv.height=H;
 const u=Math.min(W,H)/1170,g=x.createLinearGradient(0,0,W*.3,H);
 const dark=el=='水'||el=='火';
 g.addColorStop(0,dark?p.c[1]:p.c[0]);g.addColorStop(.55,dark?p.c[2]:p.c[1]);g.addColorStop(1,dark?'#0e1420':p.c[2]);
 if(el=='火'){g.addColorStop(0,'#e9a26f')}
 x.fillStyle=g;x.fillRect(0,0,W,H);
 const r=rnd([...($('name').value||'x')].reduce((a,c)=>a+c.charCodeAt(0),7)*31+el.charCodeAt(0));
 x.save();x.lineCap='round';
 if(p.pat=='wave'){for(let j=0;j<22;j++){const y0=H*.55+j*H*.022;x.strokeStyle=`rgba(255,255,255,${.05+.12*(j/22)})`;x.lineWidth=2*u;x.beginPath();for(let i=0;i<=W;i+=8){const y=y0+Math.sin(i/(120*u)+j*.7)*18*u+Math.sin(i/(47*u)+j)*6*u;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}
  x.fillStyle='rgba(245,247,250,.85)';x.beginPath();x.arc(W*.72,H*.2,110*u,0,7);x.fill();}
 if(p.pat=='bamboo'){for(let k=0;k<7;k++){const bx=W*(.05+r()*.9),w=(10+r()*16)*u;x.strokeStyle=`rgba(30,70,45,${.12+r()*.2})`;x.lineWidth=w;x.beginPath();x.moveTo(bx,H);x.lineTo(bx+(r()-.5)*60*u,H*(.1+r()*.3));x.stroke();for(let y=H;y>H*.3;y-=140*u){x.fillStyle='rgba(20,50,30,.18)';x.fillRect(bx-w*.7,y,w*1.4,4*u)}
  for(let l=0;l<5;l++){const ly=H*(.2+r()*.5);x.fillStyle=`rgba(40,90,55,${.15+r()*.2})`;x.beginPath();x.ellipse(bx+60*u*(r()-.3),ly,70*u,10*u,r()*1.4-.7,0,7);x.fill()}}}
 if(p.pat=='flame'){for(let k=0;k<26;k++){const fx=W*r(),fh=H*(.15+r()*.35);x.strokeStyle=`rgba(255,${180+r()*60|0},120,${.06+r()*.12})`;x.lineWidth=(3+r()*8)*u;x.beginPath();x.moveTo(fx,H);x.bezierCurveTo(fx+80*u*(r()-.5),H-fh*.4,fx-80*u*(r()-.5),H-fh*.7,fx+30*u*(r()-.5),H-fh);x.stroke()}
  x.fillStyle='rgba(255,230,190,.25)';x.beginPath();x.arc(W*.5,H*.28,180*u,0,7);x.fill();}
 if(p.pat=='cloud'){x.strokeStyle='rgba(140,95,40,.22)';x.lineWidth=3*u;for(let k=0;k<9;k++){const cx=W*r(),cy=H*r(),s=(40+r()*60)*u;for(let t=0;t<3;t++){x.beginPath();x.arc(cx+t*s*1.1,cy,s*(1-t*.15),Math.PI,0);x.stroke();x.beginPath();x.arc(cx+t*s*1.1,cy,s*.5,Math.PI,0);x.stroke()}}
  x.fillStyle='rgba(255,248,230,.5)';x.beginPath();x.arc(W*.3,H*.18,120*u,0,7);x.fill();}
 if(p.pat=='mountain'){for(let j=0;j<5;j++){x.fillStyle=`rgba(${110-j*12},${80-j*10},${45-j*6},${.12+j*.08})`;x.beginPath();x.moveTo(0,H);let y=H*(.55+j*.08);for(let i=0;i<=W;i+=20){y+= (r()-.5)*30*u;y=Math.min(Math.max(y,H*(.45+j*.07)),H*(.75+j*.05));x.lineTo(i,y)}x.lineTo(W,H);x.fill()}
  x.fillStyle='rgba(180,70,40,.35)';x.beginPath();x.arc(W*.7,H*.25,90*u,0,7);x.fill();}
 x.restore();
 // name vertical
 const nm=[...($('name').value||'')].slice(0,6),fs=(nm.length>4?150:190)*u,cx=W*(W>H?.5:.5);
 x.fillStyle=p.ink;x.font=`700 ${fs}px "Noto Serif SC","Noto Serif CJK SC","Songti SC",serif`;x.textAlign='center';x.textBaseline='middle';
 x.shadowColor='rgba(0,0,0,.15)';x.shadowBlur=12*u;
 const top=H*(W>H?.5:.42)-(nm.length-1)*fs*1.15/2;nm.forEach((c,i)=>x.fillText(c,cx,top+i*fs*1.15));x.shadowBlur=0;
 // seal
 const sx=cx+fs*.85,sy=top+(nm.length-1)*fs*1.15+fs*.2,ss=70*u;
 x.fillStyle=p.seal;x.fillRect(sx-ss/2,sy-ss/2,ss,ss);x.fillStyle=el=='火'?'#7a2418':'#fff6ea';x.font=`700 ${ss*.7}px serif`;x.fillText(el,sx,sy+2*u);
 // watermark
 x.font=`${26*u}px serif`;x.textAlign='right';x.fillStyle='rgba(255,255,255,.55)';x.fillText('五行配色 · 试用',W-30*u,H-40*u);
 history.replaceState(null,'','?el='+el+'&name='+encodeURIComponent(nm.join('')));
}
$('name').oninput=$('sz').onchange=draw;
$('bd').onchange=()=>{const y=new Date($('bd').value).getFullYear();if(!y)return;const e=['金','金','水','水','木','木','火','火','土','土'][y%10];el=e;$('bdh').textContent=`按出生年份尾数，推荐你试试「${e}」系配色（仅为审美推荐）`;draw()};
$('dl').onclick=()=>{const a=document.createElement('a');a.download=`五行配色-${el}-${$('name').value}.png`;a.href=$('pv').toDataURL('image/png');a.click()};
$('hd').onclick=()=>modal.style.display='flex';
$('sh').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);$('sh').textContent='链接已复制'};
draw();
</script></body></html>
