let tx0;$('mc').addEventListener('touchstart',e=>tx0=e.touches[0].clientX);$('mc').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>50)open(cur+(d<0?1:-1))});
$('dl').onclick=()=>{const[W,H]=dim(),c=document.createElement('canvas');$('dl').textContent='生成中…';setTimeout(()=>{render(c,W,H,STY[cur][0],els,nmv(),seed,true);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`五行配色-${els.join('')}-${STY[cur][1]}.png`;a.click();$('dl').textContent='下载 PNG'})},30)};
$('hdb').onclick=()=>hd.style.display='flex';$('cp').onclick=()=>{const l=location.origin+url(STY[cur][0]);(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>$('cp').textContent='已复制 ✓',()=>prompt('复制链接',l))};
$('re').onclick=()=>{seed++;update()};let tm;$('name').oninput=()=>{clearTimeout(tm);tm=setTimeout(update,350)};$('sz').onchange=update;
$('bd').onchange=()=>{const y=new Date($('bd').value).getFullYear();if(!y)return;els=[['金','金','水','水','木','木','火','火','土','土'][y%10]];update()};
update();const qs=STY.findIndex(s=>s[0]==q.get('style'));if(qs>=0)open(qs)}
</script></body></html>
