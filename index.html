<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五行配色壁纸生成器 · 东方色彩美学</title>
<style>
body{margin:0;background:#14161a;color:#eee;font-family:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif}
.w{max-width:480px;margin:auto;padding:16px}h1{font-size:22px;margin:6px 0 2px;letter-spacing:4px}.sub{color:#999;font-size:13px;margin-bottom:14px}
.els{display:flex;gap:8px}.els button{flex:1;padding:10px 0;font-size:20px;border-radius:10px;border:1px solid #444;background:#1e2127;color:#ddd;font-family:inherit}
.els button.on{border-color:#e8d3a0;color:#fff;background:#2c2a25}
label{display:block;font-size:13px;color:#aaa;margin:12px 0 4px}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1e2127;color:#eee;font-size:16px;font-family:inherit}
.hint{font-size:12px;color:#c9b68a;margin-top:4px;min-height:16px}
#pv{display:block;margin:14px auto;max-width:100%;max-height:70vh;border-radius:14px;box-shadow:0 8px 30px #0008}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:12px;border-radius:10px;border:0;font-size:15px;font-family:inherit}
#dl{background:#e8d3a0;color:#222}#hd{background:#3a3326;color:#e8d3a0;border:1px solid #e8d3a0}#sh{background:#2a2d33;color:#ddd}
.m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}.m div{background:#1f1d1a;padding:24px;border-radius:14px;max-width:300px;text-align:center;line-height:1.7}
.foot{font-size:11px;color:#666;margin-top:14px;line-height:1.6}
</style></head><body><div class="w">
<h1>五行配色壁纸</h1><div class="sub">取自东方传统色 · 为你的名字配一张壁纸</div>
<div class="els" id="els"></div><div class="hint" id="eldesc"></div>
<div class="hint" style="color:#888">可选 1–2 个元素组合</div><label>名字或短句（最多6字）</label><input id="name" maxlength="6" value="阿橙">
<label>生日（可选，仅用于推荐一种配色）</label><input id="bd" type="date"><div class="hint" id="bdh"></div>
<label>尺寸</label><select id="sz"><option value="1170x2532">手机 1170×2532</option><option value="2560x1440">电脑 2560×1440</option></select>
<canvas id="pv"></canvas>
<div class="btns"><button id="dl">下载 PNG</button><button id="hd">无水印高清版</button></div>
<div class="btns" style="margin-top:8px"><button id="sh">复制分享链接</button></div>
<div class="foot">配色灵感来自中国传统色彩与五行意象，仅作审美参考，不涉及任何运势说法。</div>
</div><div class="m" id="modal"><div><b>高清版即将上线</b><br>无水印高清图与多设备套装正在准备中，敬请期待。<br><br><button onclick="modal.style.display='none'" style="padding:8px 20px;border-radius:8px;border:0;background:#e8d3a0">好的</button></div></div>
<script>
const P={
'金':{sky:['#e7cf9a','#f7ecd0'],far:'#cdb07c',mid:'#a98450',gnd:'#6e5130',ink:'#4a3015',seal:'#b23a2a',d:'琥珀 · 缃白 —— 银杏金秋，远寺斜阳'},
'木':{sky:['#cfe1d2','#f1f4ea'],far:'#a7c1ac',mid:'#6f9677',gnd:'#3f6b4a',ink:'#1d3826',seal:'#a8362a',d:'松花绿 · 竹青 —— 竹林清晨，草木生长'},
'水':{sky:['#121d33','#5b7aa3'],far:'#34496a',mid:'#22324d',gnd:'#141f33',ink:'#f3f1ea',seal:'#b03a2e',d:'月白 · 黛蓝 —— 月照湖心，芦苇轻舟'},
'火':{sky:['#5a2236','#f2a466'],far:'#9a4f4f',mid:'#6e2c2c',gnd:'#3d1616',ink:'#fff3e6',seal:'#e9c98e',d:'朱砂 · 赭石 —— 落日枫林，灯火初上'},
'土':{sky:['#ecd9b4','#f8f0de'],far:'#cfae7f',mid:'#a7804e',gnd:'#7a5a32',ink:'#3a2810',seal:'#a33a26',d:'香色 · 赭黄 —— 层峦梯田，山路悠长'}};
const $=i=>document.getElementById(i);let els=['水'];
const q=new URLSearchParams(location.search);{const e=[...(q.get('el')||'')].filter(c=>P[c]).slice(0,2);if(e.length)els=e}
if(q.get('name'))$('name').value=q.get('name').slice(0,6);if(q.get('size'))$('sz').value=q.get('size');
Object.keys(P).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{const i=els.indexOf(k);if(i>=0){if(els.length>1)els.splice(i,1)}else{els.push(k);if(els.length>2)els.shift()}draw()};$('els').appendChild(b)});
function rng(s){s=s%2147483646+1;return()=>(s=(s*16807)%2147483647)/2147483647}
function draw(){
 [...$('els').children].forEach(b=>b.classList.toggle('on',els.includes(b.textContent)));
 const has=e=>els.includes(e),p=P[els[0]];
 $('eldesc').textContent=els.map(e=>P[e].d).join('　')+(els.length<2?'（可再点一个，组合成双元素场景）':'');
 const [W,H]=$('sz').value.split('x').map(Number),cv=$('pv'),x=cv.getContext('2d');cv.width=W;cv.height=H;
 const u=Math.min(W,H)/1170,land=W>H;
 const nm=[...($('name').value||'')].slice(0,6);
 const r=rng([...nm.join('')+els.join('')].reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0);
 const R=(a,b)=>a+(b-a)*r();
 const night=els[0]=='水';
 // sky
 let g=x.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,p.sky[0]);g.addColorStop(1,p.sky[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
 if(night)for(let i=0;i<220;i++){x.fillStyle=`rgba(255,255,240,${R(.2,.9)})`;x.beginPath();x.arc(R(0,W),R(0,H*.5),R(.6,2.4)*u,0,7);x.fill()}
 // celestial
 const cx0=W*(land?.78:.74),cy0=H*(land?.22:.17),cr=(night?80:has('火')?150:110)*u;
 const glow=x.createRadialGradient(cx0,cy0,cr*.5,cx0,cy0,cr*4);glow.addColorStop(0,night?'rgba(230,240,255,.35)':'rgba(255,240,200,.5)');glow.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=glow;x.fillRect(0,0,W,H);
 x.fillStyle=night?'#f4f1e4':has('火')?'#ffcf8a':has('金')?'#fff1c8':'#fff8e6';x.beginPath();x.arc(cx0,cy0,cr,0,7);x.fill();
 // clouds
 const cloud=(cx,cy,s,c)=>{x.fillStyle=c;x.beginPath();x.ellipse(cx,cy,s*2.6,s*.38,0,0,7);x.fill();for(let k=0;k<3;k++){x.beginPath();x.arc(cx+(k-1)*s*.9,cy-s*.15,s*R(.4,.6),Math.PI,0);x.fill()}};
 for(let i=0;i<(has('金')?6:3);i++)cloud(R(0,W),R(H*.05,H*.38),R(40,80)*u,has('金')?'rgba(240,200,120,.45)':night?'rgba(150,170,200,.18)':has('火')?'rgba(255,170,130,.35)':'rgba(255,255,255,.5)');
 // birds
 if(!night)for(let i=0;i<R(4,8);i++){const bx=R(W*.55,W*.95),by=R(H*.08,H*.3),bs=R(8,16)*u;x.strokeStyle='rgba(40,30,30,.6)';x.lineWidth=2.2*u;x.beginPath();x.moveTo(bx-bs,by-bs*.4);x.quadraticCurveTo(bx-bs*.4,by-bs*.5,bx,by);x.quadraticCurveTo(bx+bs*.4,by-bs*.5,bx+bs,by-bs*.4);x.stroke()}
 // ridges
 function ridge(y0,amp,col,fr){const ph=[R(0,9),R(0,9),R(0,9)],f=x=>y0-amp*(.55+.25*Math.sin(x/W*fr*6.3+ph[0])+.15*Math.sin(x/W*fr*17+ph[1])+.06*Math.sin(x/W*fr*45+ph[2]));x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=6)x.lineTo(i,f(i));x.lineTo(W,H);x.fill();return f}
 function fog(y,h,c){const g=x.createLinearGradient(0,y-h,0,y+h);const t=c.replace(/[\d.]+\)$/,'0)');g.addColorStop(0,t);g.addColorStop(.5,c);g.addColorStop(1,t);x.fillStyle=g;x.fillRect(0,y-h,W,h*2)}
 const fogc=night?'rgba(120,145,185,.35)':has('火')?'rgba(255,190,150,.4)':'rgba(255,252,240,.6)';
 const baseY=H*(land?.55:.5);
 const far=ridge(baseY,H*(land?.16:.1),p.far,1.2);
 if(has('金')){const px=W*(land?.2:.18),py=far(px);const s=26*u;x.fillStyle=p.mid;for(let t=0;t<7;t++){const w=s*(2.2-t*.22),yy=py-t*s*1.1;x.fillRect(px-w*.35,yy-s*.9,w*.7,s*.9);x.beginPath();x.moveTo(px-w*.75,yy-s*.75);x.quadraticCurveTo(px,yy-s*1.15,px+w*.75,yy-s*.75);x.lineTo(px+w*.5,yy-s*1.05);x.lineTo(px-w*.5,yy-s*1.05);x.fill()}x.fillRect(px-2*u,py-s*9.2,4*u,s*1.6)}
 fog(baseY,H*.04,fogc);
 const midY=baseY+H*.07,mid=ridge(midY,H*(has('土')?.12:.07),p.mid,2);
 fog(midY+H*.01,H*.035,fogc);
 // ground / water
 const wY=midY+H*.04;
 if(has('土')){ // terraced hill
  const hy=wY+H*(has('水')?-.0:.02),hx=W*(has('水')?.15:.62);
  x.fillStyle=P['土'].mid;x.beginPath();x.moveTo(hx-W*.7,H);x.quadraticCurveTo(hx,hy-H*.06,hx+W*.7,H);x.fill();
  for(let k=1;k<14;k++){x.strokeStyle=`rgba(240,215,160,${.35-k*.015})`;x.lineWidth=3*u;x.beginPath();const yy=hy-H*.03+k*H*.022;x.moveTo(hx-W*.08*k,yy+H*.03*k*.4);x.quadraticCurveTo(hx,yy-H*.01,hx+W*.08*k,yy+H*.03*k*.4);x.stroke()}
 }
 if(has('水')){
  const wg=x.createLinearGradient(0,wY,0,H);wg.addColorStop(0,night?'#3c577c':has('火')?'#c77b5c':'#a9bccb');wg.addColorStop(1,night?'#0e1729':has('火')?'#4a1c22':'#4e6a86');
  x.fillStyle=wg;x.fillRect(0,wY,W,H-wY);
  for(let i=0;i<90;i++){const yy=R(wY,H),len=R(20,90)*u*(1+(yy-wY)/H*2);x.strokeStyle=`rgba(255,255,255,${R(.05,.18)})`;x.lineWidth=2*u;x.beginPath();x.moveTo(R(0,W),yy);x.lineTo(x.currentX||0,yy);const sx=R(0,W);x.moveTo(sx,yy);x.lineTo(sx+len,yy);x.stroke()}
  for(let yy=wY+4*u;yy<H;yy+=R(10,22)*u){const wdt=cr*R(.4,1.2)*(1-(yy-wY)/H*.5);x.fillStyle=`rgba(255,245,215,${R(.25,.6)*(1-(yy-wY)/(H-wY))})`;x.fillRect(cx0-wdt/2+R(-10,10)*u,yy,wdt,3*u)}
  // boat
  const bx=W*.42,by=wY+(H-wY)*.35,bs=50*u;x.fillStyle='#1a1a22';x.beginPath();x.moveTo(bx-bs*1.6,by);x.quadraticCurveTo(bx,by+bs*.5,bx+bs*1.6,by-bs*.15);x.lineTo(bx+bs*1.1,by+bs*.05);x.lineTo(bx-bs*1.1,by+bs*.05);x.fill();x.beginPath();x.ellipse(bx,by-bs*.2,bs*.5,bs*.28,0,Math.PI,0);x.fill();x.fillRect(bx+bs*.6,by-bs*1.2,2.5*u,bs*1.2);
  // reeds shore
  x.fillStyle=p.gnd;x.beginPath();x.moveTo(0,H);x.lineTo(0,H*.86);x.quadraticCurveTo(W*.3,H*.88,W*.45,H);x.fill();
  for(let i=0;i<40;i++){const rx=R(0,W*.38),ry=H*R(.88,1),rh=R(80,200)*u;x.strokeStyle='rgba(20,20,25,.75)';x.lineWidth=2.5*u;x.beginPath();x.moveTo(rx,ry);x.quadraticCurveTo(rx+R(-10,25)*u,ry-rh*.6,rx+R(5,40)*u,ry-rh);x.stroke();if(r()<.4){x.fillStyle='rgba(60,45,30,.8)';x.beginPath();x.ellipse(rx+R(5,40)*u,ry-rh,4*u,14*u,.3,0,7);x.fill()}}
 } else if(!has('土')){
  x.fillStyle=p.gnd;x.beginPath();x.moveTo(0,H);x.lineTo(0,wY+H*.04);for(let i=0;i<=W;i+=10)x.lineTo(i,wY+H*.03+Math.sin(i/W*5+1)*H*.015);x.lineTo(W,H);x.fill();
 } else {x.fillStyle=P['土'].gnd;x.beginPath();x.moveTo(0,H);x.lineTo(0,H*.9);x.quadraticCurveTo(W*.5,H*.84,W,H*.92);x.lineTo(W,H);x.fill()}
 if(has('土')){ // path + rocks
  x.strokeStyle='rgba(250,235,200,.55)';x.lineWidth=14*u;x.beginPath();x.moveTo(W*.55,H);x.bezierCurveTo(W*.35,H*.9,W*.75,H*.84,W*.6,H*.76);x.stroke();
  for(let i=0;i<6;i++){const rx=R(0,W),ry=H*R(.9,.99),rs=R(20,55)*u;x.fillStyle='#5a4428';x.beginPath();x.ellipse(rx,ry,rs*1.4,rs,0,Math.PI,0);x.fill();x.fillStyle='rgba(255,240,210,.25)';x.beginPath();x.ellipse(rx-rs*.4,ry-rs*.5,rs*.5,rs*.2,0,0,7);x.fill()}
 }
 // trees
 const crown=(tx,ty,s,cols,n)=>{for(let i=0;i<n;i++){const a=R(0,6.3),d=Math.sqrt(r())*s;x.fillStyle=cols[i%cols.length];x.globalAlpha=R(.7,1);x.beginPath();x.arc(tx+Math.cos(a)*d*1.2,ty+Math.sin(a)*d*.8,R(.18,.32)*s,0,7);x.fill()}x.globalAlpha=1};
 const trunk=(tx,by,h,w,c)=>{x.strokeStyle=c;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(tx,by);x.quadraticCurveTo(tx+R(-20,20)*u,by-h*.5,tx+R(-15,15)*u,by-h);x.stroke();x.lineWidth=w*.4;for(let k=0;k<3;k++){x.beginPath();const yy=by-h*R(.5,.9);x.moveTo(tx,yy);x.lineTo(tx+R(-1,1)*h*.3,yy-h*.2);x.stroke()}};
 const sides=land?[[.04,.2],[.8,.97]]:[[.0,.22],[.78,1]];
 function grove(kind,side,count){for(let i=0;i<count;i++){const sd=sides[side],tx=W*R(sd[0],sd[1]),by=H*R(.93,1.02),s=R(110,190)*u,h=s*R(2.2,3.2);
  if(kind=='bamboo'){const bh=H*R(.45,.8);x.strokeStyle=`rgba(${R(40,70)|0},${R(95,125)|0},${R(60,80)|0},.95)`;x.lineWidth=R(12,22)*u;x.beginPath();x.moveTo(tx,by);x.lineTo(tx+R(-30,30)*u,by-bh);x.stroke();for(let y=by;y>by-bh;y-=R(90,140)*u){x.fillStyle='rgba(20,50,30,.45)';x.fillRect(tx-12*u,y,24*u,4*u)}
   for(let l=0;l<9;l++){const ly=by-bh*R(.35,1),lx=tx;x.fillStyle=`rgba(${R(50,90)|0},${R(110,150)|0},${R(60,90)|0},.9)`;x.save();x.translate(lx,ly);x.rotate(R(-2.4,-.7)*(r()<.5?1:-1));x.beginPath();x.ellipse(45*u,0,48*u,8*u,0,0,7);x.fill();x.restore()}}
  else{trunk(tx,by,h,R(14,22)*u,kind=='ginkgo'?'#5a3c22':kind=='maple'?'#2e1612':'#3a3020');
   const cols=kind=='ginkgo'?['#f2c14e','#e8a93a','#f7d774','#d99a2b']:kind=='maple'?['#c8322a','#e0573a','#a3231f','#f07a45']:['#4f8a55','#6aa06a','#3d7047','#86b67a'];crown(tx,by-h,s,cols,90)}}}
 const fg=[];if(has('木'))fg.push('bamboo','tree');if(has('火'))fg.push('maple');if(has('金'))fg.push('ginkgo');if(has('土')&&els.length==1)fg.push('tree');
 if(fg.length)for(let sd=0;sd<2;sd++){if(has('水')&&sd==0&&els.length==2)continue;grove(fg[sd%fg.length],sd,3);if(fg.length>2)grove(fg[2],sd,1)}
 if(has('木')){for(let i=0;i<260;i++){const gx=R(0,W),gy=H*R(.9,1);x.strokeStyle=`rgba(${R(60,110)|0},${R(120,170)|0},${R(60,90)|0},.8)`;x.lineWidth=2*u;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+R(-8,8)*u,gy-R(20,60)*u);x.stroke()}}
 if(has('金')||has('火'))for(let i=0;i<50;i++){x.fillStyle=has('金')?'rgba(245,195,80,.85)':'rgba(220,70,50,.85)';x.save();x.translate(R(0,W),R(H*.55,H));x.rotate(R(0,6));x.beginPath();x.moveTo(0,0);x.arc(0,0,R(6,12)*u,-.6,.6);x.fill();x.restore()}
 if(has('火'))for(let i=0;i<4;i++){const lx=W*(i<2?R(.06,.2):R(.8,.94)),ly=H*R(.6,.75);const lg=x.createRadialGradient(lx,ly,2,lx,ly,70*u);lg.addColorStop(0,'rgba(255,200,120,.7)');lg.addColorStop(1,'rgba(255,120,60,0)');x.fillStyle=lg;x.fillRect(lx-70*u,ly-70*u,140*u,140*u);x.strokeStyle='#2a1410';x.lineWidth=2*u;x.beginPath();x.moveTo(lx,ly-60*u);x.lineTo(lx,ly-26*u);x.stroke();x.fillStyle='#d8402c';x.beginPath();x.ellipse(lx,ly,22*u,28*u,0,0,7);x.fill();x.fillStyle='#ffd08a';x.fillRect(lx-12*u,ly-30*u,24*u,5*u);x.fillRect(lx-12*u,ly+25*u,24*u,5*u)}
 // text
 const n=Math.max(nm.length,1),fs=Math.min(190*u,H*(land?.5:.34)/(n*1.15)),tx=W*.5,top=H*(land?.1:.12)+fs*.6;
 const tg=x.createRadialGradient(tx,top+(n-1)*fs*.57,0,tx,top+(n-1)*fs*.57,fs*n*.9);tg.addColorStop(0,night||has('火')&&els[0]=='火'?'rgba(0,0,0,.18)':'rgba(255,255,255,.28)');tg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=tg;x.fillRect(0,0,W,H);
 x.fillStyle=p.ink;x.font=`700 ${fs}px "Noto Serif SC","Noto Serif CJK SC","Songti SC",serif`;x.textAlign='center';x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=14*u;
 nm.forEach((c,i)=>x.fillText(c,tx,top+i*fs*1.15));x.shadowBlur=0;
 const ss=64*u,sx=tx+fs*.82,sy=top+(n-1)*fs*1.15+fs*.25;x.fillStyle=p.seal;x.fillRect(sx-ss/2,sy-ss*els.length/2,ss,ss*els.length);x.fillStyle=els[0]=='火'?'#7a2418':'#fff6ea';x.font=`700 ${ss*.68}px serif`;els.forEach((e,i)=>x.fillText(e,sx,sy-ss*(els.length-1)/2+i*ss+2*u));
 x.font=`${26*u}px serif`;x.textAlign='right';x.fillStyle='rgba(255,255,255,.6)';x.fillText('五行配色 · 试用',W-30*u,H-40*u);
 history.replaceState(null,'','?el='+els.join('')+'&name='+encodeURIComponent(nm.join('')));
}
$('name').oninput=$('sz').onchange=draw;
$('bd').onchange=()=>{const y=new Date($('bd').value).getFullYear();if(!y)return;const e=['金','金','水','水','木','木','火','火','土','土'][y%10];els=[e];$('bdh').textContent=`按出生年份尾数，推荐你试试「${e}」系配色（仅为审美推荐）`;draw()};
$('dl').onclick=()=>{const a=document.createElement('a');a.download=`五行配色-${els.join('')}-${$('name').value}.png`;a.href=$('pv').toDataURL('image/png');a.click()};
$('hd').onclick=()=>modal.style.display='flex';
$('sh').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);$('sh').textContent='链接已复制'};
draw();
</script></body></html>
